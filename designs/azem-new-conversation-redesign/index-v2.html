<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Azem 新对话首页 · assistant-ui × Tool UI</title>
  <!--
    Assumptions
    - This is the empty, new-conversation state of Azem's desktop app.
    - The composer remains the only primary action; task-suggestion cards stay removed.
    - Existing project, branch, approval, plan, model, attachment, and send controls remain available.

    Source context
    - frontend/src/components/ThreadSurface.tsx
    - frontend/src/components/thread/Composer.tsx
    - frontend/src/styles/{base,composer,model-controls,thread}.css
    - frontend/src/prototype.css

    Design decision
    - Synthesize assistant-ui's quiet 24px composer with Tool UI's inset control density.
    - Keep project and branch as compact context pills inside the composer instead of a separate rail.
    - Let spacing, a soft border, and 32px controls establish hierarchy; no suggestions or decorative framing.
  -->
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f2ed;
      --paper: #fffefa;
      --paper-muted: #f7f6f1;
      --hover: #ecebe6;
      --ink: #181816;
      --ink-soft: #2a2a27;
      --muted: #6f6e68;
      --faint: #9b9a92;
      --line: #deddd5;
      --line-strong: #c9c8bf;
      --signal: #2858ff;
      --signal-soft: #eef1ff;
      --danger: #c54538;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: "SFMono-Regular", "Cascadia Code", Consolas, Menlo, monospace;
      font-family: var(--font);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html, body, #root { width: 100%; min-width: 0; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--canvas); color: var(--ink); }
    button, textarea, input { font: inherit; }
    button { border: 0; background: none; color: inherit; cursor: pointer; }
    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }
    button:disabled { cursor: default; }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(40px, 7vh, 76px) clamp(34px, 6vw, 96px) clamp(72px, 12vh, 132px);
      background: var(--paper);
    }


    .workbench {
      position: relative;
      width: min(840px, 100%);
      min-width: 0;
      transform: translateY(-3vh);
    }

    .workbench::before,
    .workbench::after { content: none; }

    .intro {
      width: 100%;
      margin-bottom: 22px;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(30px, 3vw, 36px);
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: 1.12;
      text-wrap: balance;
    }

    .intro p {
      max-width: 520px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      text-wrap: pretty;
    }

    .composer-shell {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 1px 3px rgb(24 24 20 / 8%), 0 1px 2px -1px rgb(24 24 20 / 7%);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .composer-shell:focus-within {
      border-color: color-mix(in srgb, var(--signal) 30%, var(--line));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 8%, transparent), 0 1px 3px rgb(24 24 20 / 8%);
    }

    .workspace-rail {
      position: relative;
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
    }

    .rail-control {
      position: relative;
      min-width: 0;
    }

    .rail-button {
      min-height: 30px;
      max-width: min(420px, 48vw);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--ink) 3%, transparent);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .rail-button:hover,
    .rail-button[aria-expanded="true"] {
      border-color: var(--line-strong);
      background: var(--hover);
      color: var(--ink);
    }

    .rail-button .label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rail-control + .rail-control::before { content: none; }

    .folder-mark {
      position: relative;
      width: 13px;
      height: 10px;
      flex: 0 0 13px;
      border: 1px solid currentColor;
      border-radius: 2px;
      opacity: .78;
    }

    .folder-mark::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 1px;
      width: 6px;
      height: 3px;
      border: 1px solid currentColor;
      border-bottom: 0;
      border-radius: 2px 2px 0 0;
      background: transparent;
    }

    .branch-mark {
      position: relative;
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
    }

    .branch-mark::before,
    .branch-mark::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .branch-mark::before { top: 0; left: 0; }
    .branch-mark::after { right: 0; bottom: 0; }
    .branch-mark span {
      position: absolute;
      top: 4px;
      left: 3px;
      width: 7px;
      height: 5px;
      border-left: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
    }

    .caret {
      flex: 0 0 auto;
      color: #8f8e88;
      font-family: var(--font);
      font-size: 11px;
      transition: transform 150ms ease;
    }

    .rail-button[aria-expanded="true"] .caret { transform: rotate(180deg); }

    .composer-input {
      width: 100%;
      min-height: 88px;
      max-height: 220px;
      display: block;
      resize: vertical;
      border: 0;
      outline: 0;
      padding: 10px 12px 8px;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
    }

    .composer-input::placeholder { color: var(--faint); }

    .attachment-chip {
      width: fit-content;
      max-width: calc(100% - 8px);
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 4px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--ink) 3%, transparent);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    .attachment-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-chip button {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 4px;
      color: var(--faint);
    }

    .attachment-chip button:hover { background: var(--line); color: var(--ink); }

    .toolbar {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: 0;
    }

    .tool-button,
    .model-button,
    .send-button {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .tool-button { padding: 0 10px; }
    .tool-button.icon-only { width: 32px; padding: 0; font-size: 20px; font-weight: 300; }
    .tool-button:hover,
    .tool-button[aria-pressed="true"],
    .tool-button[aria-expanded="true"],
    .model-button:hover,
    .model-button[aria-expanded="true"] {
      background: color-mix(in srgb, var(--ink) 5%, transparent);
      color: var(--ink);
    }

    .tool-button[aria-pressed="true"] { box-shadow: none; }

    .toolbar-spacer { flex: 1; }

    .model-control { position: relative; }
    .model-button { max-width: 210px; padding: 0 10px; font-weight: 590; }
    .model-button .model-name { overflow: hidden; text-overflow: ellipsis; }
    .model-button .tier { color: var(--faint); font-weight: 450; }

    .send-button {
      width: 32px;
      flex: 0 0 32px;
      padding: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      transition: background 140ms ease, transform 140ms ease;
    }

    .send-button:not(:disabled):hover { background: var(--ink-soft); transform: translateY(-1px); }
    .send-button:disabled { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--faint); }

    .send-arrow {
      width: 8px;
      height: 8px;
      border-top: 1.5px solid currentColor;
      border-left: 1.5px solid currentColor;
      transform: translateY(2px) rotate(45deg);
    }

    .send-arrow::after {
      content: "";
      position: absolute;
      width: 1.5px;
      height: 11px;
      background: currentColor;
      transform: translate(3px, -2px) rotate(-45deg);
      transform-origin: center;
    }

    .status {
      min-width: 0;
      color: var(--signal);
      font-size: 11px;
      opacity: 0;
      transition: opacity 150ms ease;
    }

    .status.visible { opacity: 1; }

    .popover {
      position: absolute;
      z-index: 20;
      width: 286px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 18px 48px rgb(20 20 18 / 14%);
      animation: popover-in 140ms ease-out;
    }

    .workspace-rail .popover { top: calc(100% + 8px); left: 0; }
    .branch-control .popover { width: min(340px, calc(100vw - 64px)); }
    .model-control .popover { right: 0; bottom: calc(100% + 8px); }

    .popover-heading {
      padding: 11px 12px 7px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .05em;
    }

    .popover-list { display: grid; gap: 2px; padding: 4px 5px 6px; }

    .popover-option {
      width: 100%;
      min-height: 38px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 7px 9px;
      border-radius: 7px;
      color: var(--ink);
      text-align: left;
    }

    .popover-option:hover { background: var(--paper-muted); }
    .popover-option.selected { background: var(--signal-soft); }
    .popover-option span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .popover-option small { color: var(--faint); font-size: 10px; }
    .popover-option .check { color: var(--signal); font-size: 12px; }

    @keyframes popover-in {
      from { opacity: 0; transform: translateY(4px); }
    }

    @media (max-width: 760px) {
      .page { place-items: start center; padding: 78px 24px 56px; overflow: auto; }
      .workbench { transform: none; }
      .intro h1 { font-size: 30px; }
      .workspace-rail { flex-wrap: wrap; }
      .rail-control { max-width: 50%; display: flex; align-items: center; }
      .rail-button { max-width: 100%; }
      .composer-input { min-height: 80px; }
      .toolbar { flex-wrap: wrap; }
      .status { order: 5; width: 100%; padding: 0 8px 3px; }
    }

    @media (max-height: 640px) and (min-width: 761px) {
      .page { padding-top: 34px; padding-bottom: 42px; }
      .workbench { transform: none; }
      .intro { margin-bottom: 16px; }
      .composer-input { min-height: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0s !important; animation-duration: 0s !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    function Popover({ label, options, value, onChoose }) {
      return (
        <section className="popover" role="listbox" aria-label={label}>
          <div className="popover-heading">{label}</div>
          <div className="popover-list">
            {options.map((option) => (
              <button
                type="button"
                className={`popover-option ${option.value === value ? "selected" : ""}`}
                role="option"
                aria-selected={option.value === value}
                key={option.value}
                onClick={() => onChoose(option.value)}
              >
                <span>{option.label}</span>
                {option.value === value ? <span className="check">✓</span> : <small>{option.meta}</small>}
              </button>
            ))}
          </div>
        </section>
      );
    }

    function App() {
      const [project, setProject] = useState("azem");
      const [branch, setBranch] = useState("feat/runtime-provider-desktop-reliability");
      const [prompt, setPrompt] = useState("");
      const [plan, setPlan] = useState(false);
      const [approvalIndex, setApprovalIndex] = useState(0);
      const [model, setModel] = useState("Ox Alpha");
      const [openMenu, setOpenMenu] = useState("");
      const [attachment, setAttachment] = useState("");
      const [submitted, setSubmitted] = useState(false);
      const fileInput = useRef(null);
      const submitTimer = useRef(0);

      const projects = [
        { value: "azem", label: "azem", meta: "当前项目" },
        { value: "llmux", label: "llmux", meta: "本地项目" },
        { value: "venat", label: "venat", meta: "本地项目" },
      ];
      const branches = [
        { value: "feat/runtime-provider-desktop-reliability", label: "feat/runtime-provider-desktop-reliability", meta: "当前" },
        { value: "main", label: "main", meta: "默认" },
        { value: "feat/new-conversation-workbench", label: "feat/new-conversation-workbench", meta: "最近" },
      ];
      const models = [
        { value: "Ox Alpha", label: "Ox Alpha", meta: "最高" },
        { value: "GPT-5.6", label: "GPT-5.6", meta: "高" },
        { value: "Grok 4.6", label: "Grok 4.6", meta: "高" },
      ];
      const approvals = ["自动审查", "每次询问", "完全访问"];

      useEffect(() => {
        const close = (event) => {
          if (!event.target.closest("[data-popover-root]")) setOpenMenu("");
        };
        const escape = (event) => {
          if (event.key === "Escape") setOpenMenu("");
        };
        document.addEventListener("pointerdown", close);
        document.addEventListener("keydown", escape);
        return () => {
          document.removeEventListener("pointerdown", close);
          document.removeEventListener("keydown", escape);
          window.clearTimeout(submitTimer.current);
        };
      }, []);

      const toggleMenu = (name) => setOpenMenu((current) => current === name ? "" : name);
      const choose = (setter) => (value) => {
        setter(value);
        setOpenMenu("");
      };
      const submit = () => {
        if (!prompt.trim() && !attachment) return;
        setSubmitted(true);
        setPrompt("");
        setAttachment("");
        window.clearTimeout(submitTimer.current);
        submitTimer.current = window.setTimeout(() => setSubmitted(false), 1600);
      };

      return (
        <main className="page" data-screen-label="Azem new conversation — assistant-ui and Tool UI synthesis">
          <section className="workbench" aria-labelledby="page-title">
            <header className="intro">
              <h1 id="page-title">准备开始什么？</h1>
              <p>选择一个项目，然后描述要交给 Azem 完成的任务。</p>
            </header>

            <section className="composer-shell" aria-label="新对话编辑器">
              <div className="workspace-rail" aria-label="当前工作区">
                <div className="rail-control" data-popover-root="true">
                  <button
                    type="button"
                    className="rail-button"
                    aria-label={`切换项目：${project}`}
                    aria-expanded={openMenu === "project"}
                    onClick={() => toggleMenu("project")}
                  >
                    <span className="folder-mark" aria-hidden="true"></span>
                    <span className="label">{project}</span>
                    <span className="caret" aria-hidden="true">⌄</span>
                  </button>
                  {openMenu === "project" ? <Popover label="选择项目" options={projects} value={project} onChoose={choose(setProject)} /> : null}
                </div>

                <div className="rail-control branch-control" data-popover-root="true">
                  <button
                    type="button"
                    className="rail-button"
                    aria-label={`切换分支：${branch}`}
                    aria-expanded={openMenu === "branch"}
                    onClick={() => toggleMenu("branch")}
                  >
                    <span className="branch-mark" aria-hidden="true"><span></span></span>
                    <span className="label">{branch}</span>
                    <span className="caret" aria-hidden="true">⌄</span>
                  </button>
                  {openMenu === "branch" ? <Popover label="切换分支" options={branches} value={branch} onChoose={choose(setBranch)} /> : null}
                </div>
              </div>

              {attachment ? (
                <div className="attachment-chip">
                  <span>{attachment}</span>
                  <button type="button" aria-label="移除附件" onClick={() => setAttachment("")}>×</button>
                </div>
              ) : null}

              <textarea
                className="composer-input"
                value={prompt}
                onChange={(event) => setPrompt(event.target.value)}
                onKeyDown={(event) => {
                  if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    submit();
                  }
                }}
                placeholder="描述要完成的任务，@ 引用文件，/ 使用技能…"
                aria-label="描述要完成的任务"
              ></textarea>

              <footer className="toolbar">
                <button type="button" className="tool-button icon-only" aria-label="添加图片" onClick={() => fileInput.current?.click()}>+</button>
                <input
                  ref={fileInput}
                  type="file"
                  accept="image/*"
                  hidden
                  onChange={(event) => setAttachment(event.target.files?.[0]?.name || "")}
                />
                <button
                  type="button"
                  className="tool-button"
                  aria-label="切换审查模式"
                  onClick={() => setApprovalIndex((approvalIndex + 1) % approvals.length)}
                >
                  <span>{approvals[approvalIndex]}</span>
                  <span className="caret" aria-hidden="true">⌄</span>
                </button>
                <button type="button" className="tool-button" aria-pressed={plan} onClick={() => setPlan(!plan)}>计划</button>
                <span className={`status ${submitted ? "visible" : ""}`} role="status">已提交</span>
                <span className="toolbar-spacer"></span>
                <div className="model-control" data-popover-root="true">
                  <button
                    type="button"
                    className="model-button"
                    aria-expanded={openMenu === "model"}
                    onClick={() => toggleMenu("model")}
                  >
                    <span className="model-name">{model}</span>
                    <span className="tier">最高</span>
                    <span className="caret" aria-hidden="true">⌄</span>
                  </button>
                  {openMenu === "model" ? <Popover label="选择模型" options={models} value={model} onChoose={choose(setModel)} /> : null}
                </div>
                <button type="button" className="send-button" aria-label="发送" disabled={!prompt.trim() && !attachment} onClick={submit}>
                  <span className="send-arrow" aria-hidden="true"></span>
                </button>
              </footer>
            </section>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
