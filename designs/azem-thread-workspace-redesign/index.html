<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Azem 线程工作区 · 顶部任务计划</title>
  <!--
    Assumptions
    - The persistent right-side context inspector is removed completely.
    - Context occupancy remains available through the existing composer context control.
    - The durable Todo list remains the only task state; this surface is only a projection.

    Design decision
    - Reclaim the full reading width and move Todo into a 44px strip beneath the thread header.
    - Collapsed state shows progress, current work, and next work.
    - Expanded state is a floating 480px plan surface; it never reflows the transcript.
    - Visual language continues the assistant-ui × Tool UI synthesis: quiet border, large radius, compact state marks.
  -->
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f3;
      --paper: #ffffff;
      --paper-muted: #fafaf9;
      --sidebar: #f1f1ef;
      --hover: #e9e9e6;
      --ink: #171716;
      --muted: #72726e;
      --faint: #a6a6a0;
      --line: #e5e5e1;
      --line-strong: #d8d8d2;
      --blue: #3478f6;
      --green: #16884b;
      --red: #d94747;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: "SFMono-Regular", "Cascadia Code", Consolas, Menlo, monospace;
      font-family: var(--font);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #111; color: var(--ink); }
    button, textarea { font: inherit; }
    button { border: 0; background: none; color: inherit; cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .window {
      width: calc(100% - 36px);
      height: calc(100% - 36px);
      min-width: 820px;
      min-height: 620px;
      margin: 18px;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 38%);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 24px 80px rgb(0 0 0 / 22%);
    }

    .titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: #f5f6f7;
    }

    .traffic { width: 12px; height: 12px; border-radius: 50%; }
    .traffic.red { background: #ef6a61; }
    .traffic.amber { background: #f4bd4f; }
    .traffic.green { background: #61c454; }

    .app-grid {
      height: calc(100% - 38px);
      display: grid;
      grid-template-columns: 246px 1px minmax(0, 1fr);
      background: var(--paper);
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--sidebar);
    }

    .divider { background: var(--line); }

    .sidebar-tabs {
      height: 52px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 10px 12px;
    }

    .sidebar-tabs button {
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .sidebar-tabs button.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 1px 3px rgb(20 20 17 / 8%);
    }

    .sidebar-nav { display: grid; gap: 2px; padding: 4px 10px 12px; border-bottom: 1px solid var(--line); }
    .sidebar-nav button, .sidebar-footer button {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 9px;
      border-radius: 7px;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
    }
    .sidebar-nav button:hover, .sidebar-footer button:hover { background: var(--hover); color: var(--ink); }
    .nav-mark { width: 14px; text-align: center; font-size: 16px; font-weight: 300; }
    .shortcut { margin-left: auto; color: var(--faint); font: 9px var(--mono); }

    .project-scroll { min-height: 0; flex: 1; overflow: auto; padding: 18px 11px; }
    .project-label { display: flex; align-items: center; justify-content: space-between; padding: 0 7px 8px; color: var(--faint); font-size: 9px; }
    .project-heading { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 7px; font-size: 12px; font-weight: 620; }
    .session-list { display: grid; gap: 1px; margin: 5px 0 14px 15px; padding-left: 8px; border-left: 1px solid var(--line-strong); }
    .session-row { min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 7px; border-radius: 7px; color: var(--muted); font-size: 11px; text-align: left; }
    .session-row:hover, .session-row.active { background: color-mix(in srgb, var(--paper) 72%, transparent); color: var(--ink); }
    .session-dot { width: 6px; height: 6px; flex: 0 0 6px; border: 1px solid var(--faint); border-radius: 50%; }
    .session-row span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .sidebar-footer { padding: 8px 10px; border-top: 1px solid var(--line); }

    .thread {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }

    .thread-header {
      height: 50px;
      flex: 0 0 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .task-kicker { color: var(--faint); font: 9px var(--mono); letter-spacing: .12em; }
    .thread-title { min-width: 0; max-width: 360px; overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .thread-meta { min-width: 0; display: flex; align-items: center; gap: 7px; padding-left: 10px; border-left: 1px solid var(--line); color: var(--faint); font: 9px var(--mono); }
    .thread-meta span { max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-spacer { flex: 1; }
    .status-pill { min-height: 26px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 999px; background: color-mix(in srgb, var(--green) 7%, transparent); color: var(--green); font-size: 10px; }
    .header-button { min-height: 30px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-size: 11px; }
    .header-button:hover { background: var(--paper-muted); color: var(--ink); }

    .plan-shell {
      position: relative;
      z-index: 30;
      height: 44px;
      flex: 0 0 44px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-muted) 72%, var(--paper));
    }

    .plan-trigger {
      width: 100%;
      height: 44px;
      display: grid;
      grid-template-columns: auto minmax(0, 1.3fr) minmax(0, .9fr) auto;
      align-items: center;
      gap: 12px;
      padding: 0 16px 0 20px;
      text-align: left;
    }

    .plan-trigger:hover { background: color-mix(in srgb, var(--ink) 2.5%, transparent); }

    .plan-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .plan-summary strong { font-size: 11px; font-weight: 650; }
    .plan-count { color: var(--faint); font: 9px var(--mono); }
    .plan-meter { width: 34px; height: 3px; overflow: hidden; border-radius: 999px; background: var(--line); }
    .plan-meter span { width: 20%; height: 100%; display: block; border-radius: inherit; background: var(--blue); }

    .plan-current,
    .plan-next { min-width: 0; display: flex; align-items: baseline; gap: 7px; overflow: hidden; }
    .plan-current small,
    .plan-next small { flex: 0 0 auto; color: var(--faint); font-size: 9px; }
    .plan-current span,
    .plan-next span { min-width: 0; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .plan-current span { color: var(--ink); font-weight: 560; }

    .plan-chevron {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--faint);
      transition: transform 150ms ease, background 150ms ease;
    }
    .plan-trigger[aria-expanded="true"] .plan-chevron { transform: rotate(180deg); background: var(--hover); color: var(--ink); }

    .plan-panel {
      position: absolute;
      z-index: 50;
      top: calc(100% + 8px);
      right: 16px;
      width: min(480px, calc(100vw - 294px));
      max-height: min(520px, calc(100vh - 150px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line-strong) 78%, transparent);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 60px rgb(20 20 18 / 16%), 0 2px 8px rgb(20 20 18 / 6%);
      animation: panel-in 160ms cubic-bezier(.22, 1, .36, 1);
    }

    .plan-panel-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 16px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }
    .plan-panel-heading { display: flex; align-items: baseline; gap: 9px; }
    .plan-panel-heading h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .plan-panel-heading span { color: var(--faint); font: 10px var(--mono); }
    .plan-panel-header p { grid-column: 1; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; text-wrap: pretty; }
    .plan-close { grid-column: 2; grid-row: 1 / span 2; width: 30px; height: 30px; display: grid; place-items: center; align-self: start; border-radius: 50%; color: var(--muted); font-size: 18px; }
    .plan-close:hover { background: var(--paper-muted); color: var(--ink); }

    .plan-progress { height: 4px; overflow: hidden; background: var(--paper-muted); }
    .plan-progress span { width: 20%; height: 100%; display: block; background: var(--blue); }

    .plan-scroll { min-height: 0; overflow: auto; padding: 8px 10px 14px; }
    .plan-phase { padding: 10px 8px 2px; }
    .plan-phase + .plan-phase { margin-top: 4px; border-top: 1px solid var(--line); }
    .plan-phase h3 { margin: 0 0 5px; color: var(--faint); font: 9px var(--mono); font-weight: 560; letter-spacing: .04em; }
    .plan-items { margin: 0; padding: 0; list-style: none; }
    .plan-item { min-height: 39px; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 5px 7px; border-radius: 10px; color: var(--muted); }
    .plan-item[data-state="in_progress"] { background: color-mix(in srgb, var(--blue) 5%, var(--paper)); color: var(--ink); }
    .plan-item-label { min-width: 0; font-size: 11px; line-height: 1.35; }
    .plan-item-state { color: var(--faint); font: 9px var(--mono); }
    .plan-item[data-state="in_progress"] .plan-item-state { color: var(--blue); }
    .plan-item[data-state="completed"] .plan-item-state { color: var(--green); }
    .task-mark { width: 15px; height: 15px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--green); font-size: 10px; }
    .plan-item[data-state="completed"] .task-mark { border-color: color-mix(in srgb, var(--green) 50%, var(--line)); }
    .plan-item[data-state="in_progress"] .task-mark { border-color: color-mix(in srgb, var(--blue) 55%, var(--line)); }
    .plan-item[data-state="in_progress"] .task-mark::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }

    .thread-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .transcript { height: 100%; overflow: auto; padding: 26px 0 178px; }
    .reading-column { width: min(840px, calc(100% - 56px)); margin: 0 auto; }
    .answer { font-size: 13px; line-height: 1.72; }
    .answer h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: -.025em; }
    .answer h2 { margin: 24px 0 8px; font-size: 14px; }
    .answer p { margin: 0 0 12px; }
    .answer code { padding: 2px 5px; border-radius: 5px; background: var(--paper-muted); font: 11px var(--mono); }
    .answer ul { display: grid; gap: 7px; margin: 8px 0 16px; padding-left: 20px; }

    .change-card { margin-top: 24px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; }
    .change-card header { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .change-card header strong { font-size: 12px; }
    .change-card header small { color: var(--faint); font: 9px var(--mono); }
    .change-card header span { margin-left: auto; color: var(--green); font: 10px var(--mono); }
    .file-row { min-height: 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding: 0 14px; border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent); }
    .file-row:last-child { border-bottom: 0; }
    .file-row code { overflow: hidden; background: transparent; text-overflow: ellipsis; white-space: nowrap; }
    .file-row span { color: var(--green); font: 10px var(--mono); }

    .composer-dock { position: absolute; z-index: 18; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; pointer-events: none; }
    .composer { width: min(680px, calc(100% - 42px)); display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid color-mix(in srgb, var(--line) 72%, transparent); border-radius: 24px; background: var(--paper); box-shadow: 0 9px 30px rgb(24 24 20 / 13%); pointer-events: auto; }
    .composer textarea { width: 100%; min-height: 58px; resize: none; border: 0; outline: 0; padding: 7px 9px; background: transparent; color: var(--ink); font-size: 13px; line-height: 1.55; }
    .composer textarea::placeholder { color: var(--faint); }
    .composer-toolbar { min-height: 32px; display: flex; align-items: center; gap: 4px; }
    .composer-toolbar button { min-height: 32px; padding: 0 10px; border-radius: 999px; color: var(--muted); font-size: 11px; }
    .composer-toolbar button:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
    .composer-toolbar .plus-button, .composer-toolbar .context-button, .composer-toolbar .send-button { width: 32px; padding: 0; }
    .composer-toolbar .spacer { flex: 1; }
    .composer-toolbar .send-button { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--faint); }

    @keyframes panel-in { from { opacity: 0; transform: translateY(-5px) scale(.985); } }

    @media (max-width: 1040px) {
      .app-grid { grid-template-columns: 206px 1px minmax(0, 1fr); }
      .plan-trigger { grid-template-columns: auto minmax(0, 1fr) auto; }
      .plan-next { display: none; }
      .plan-panel { width: min(480px, calc(100vw - 246px)); }
      .thread-meta { display: none; }
    }

    @media (max-height: 700px) {
      .transcript { padding-top: 18px; }
      .answer h2 { margin-top: 17px; }
      .plan-panel { max-height: calc(100vh - 130px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    const planPhases = [
      {
        title: "界面迁移",
        items: [
          { label: "移除右侧上下文面板", state: "completed", stateLabel: "完成" },
          { label: "把任务计划迁移到顶部状态条", state: "in_progress", stateLabel: "进行中" },
          { label: "更新键盘与响应式交互", state: "pending", stateLabel: "待处理" },
        ],
      },
      {
        title: "验证",
        items: [
          { label: "运行前端和桌面检查", state: "pending", stateLabel: "待处理" },
          { label: "实机验证最终布局", state: "pending", stateLabel: "待处理" },
        ],
      },
    ];

    function PlanPanel({ onClose, panelRef }) {
      return (
        <section ref={panelRef} className="plan-panel" id="thread-plan-panel" role="region" aria-label="任务计划详情">
          <header className="plan-panel-header">
            <div className="plan-panel-heading"><h2>任务计划</h2><span>1 / 5</span></div>
            <p>移除持续占宽的上下文栏，把执行状态放回线程工作流。</p>
            <button type="button" className="plan-close" aria-label="关闭任务计划" onClick={onClose}>×</button>
          </header>
          <div className="plan-progress" role="progressbar" aria-label="任务进度 1 / 5" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1"><span></span></div>
          <div className="plan-scroll">
            {planPhases.map((phase) => (
              <section className="plan-phase" key={phase.title}>
                <h3>{phase.title}</h3>
                <ul className="plan-items">
                  {phase.items.map((item) => (
                    <li className="plan-item" data-state={item.state} key={item.label} aria-label={`${item.label}，${item.stateLabel}`}>
                      <span className="task-mark" aria-hidden="true">{item.state === "completed" ? "✓" : ""}</span>
                      <span className="plan-item-label">{item.label}</span>
                      <span className="plan-item-state">{item.stateLabel}</span>
                    </li>
                  ))}
                </ul>
              </section>
            ))}
          </div>
        </section>
      );
    }

    function App() {
      const [planOpen, setPlanOpen] = useState(false);
      const shellRef = useRef(null);
      const triggerRef = useRef(null);
      const panelRef = useRef(null);

      useEffect(() => {
        const outside = (event) => {
          if (!shellRef.current?.contains(event.target)) setPlanOpen(false);
        };
        const keyboard = (event) => {
          if (event.key !== "Escape" || !planOpen) return;
          setPlanOpen(false);
          requestAnimationFrame(() => triggerRef.current?.focus());
        };
        document.addEventListener("pointerdown", outside, true);
        document.addEventListener("keydown", keyboard);
        return () => {
          document.removeEventListener("pointerdown", outside, true);
          document.removeEventListener("keydown", keyboard);
        };
      }, [planOpen]);

      return (
        <main className="window" data-screen-label="Azem thread workspace — top task plan strip">
          <div className="titlebar" aria-hidden="true"><span className="traffic red"></span><span className="traffic amber"></span><span className="traffic green"></span></div>
          <div className="app-grid">
            <aside className="sidebar" aria-label="会话导航">
              <div className="sidebar-tabs"><button type="button" className="active">会话</button><button type="button">工作区</button></div>
              <nav className="sidebar-nav" aria-label="主要导航">
                <button type="button"><span className="nav-mark">＋</span><span>新对话</span><span className="shortcut">⌘N</span></button>
                <button type="button"><span className="nav-mark">⌕</span><span>搜索</span><span className="shortcut">⌘K</span></button>
                <button type="button"><span className="nav-mark">◇</span><span>安全扫描</span></button>
              </nav>
              <div className="project-scroll">
                <div className="project-label"><span>项目</span><span>＋</span></div>
                <div className="project-heading"><span>⌄</span><span>azem</span></div>
                <div className="session-list">
                  <button type="button" className="session-row active"><span className="session-dot"></span><span>重新设计任务计划位置</span></button>
                  <button type="button" className="session-row"><span className="session-dot"></span><span>修复输入法英文回车误发送问题</span></button>
                  <button type="button" className="session-row"><span className="session-dot"></span><span>参考 assistant-ui 改造 plan</span></button>
                  <button type="button" className="session-row"><span className="session-dot"></span><span>调整留白并移除当前回合</span></button>
                </div>
                <div className="project-heading"><span>›</span><span>shark-cmdb</span></div>
              </div>
              <div className="sidebar-footer"><button type="button"><span className="nav-mark">⚙</span><span>设置</span></button></div>
            </aside>
            <div className="divider"></div>
            <section className="thread">
              <header className="thread-header">
                <span className="task-kicker">TASK</span>
                <strong className="thread-title">重新设计右侧任务计划位置</strong>
                <div className="thread-meta"><span>azem</span><span>·</span><span>feat/runtime-provider-desktop-reliability</span></div>
                <span className="header-spacer"></span>
                <span className="status-pill">就绪</span>
                <button type="button" className="header-button">终端</button>
              </header>

              <div className="plan-shell" ref={shellRef}>
                <button
                  ref={triggerRef}
                  type="button"
                  className="plan-trigger"
                  aria-expanded={planOpen}
                  aria-controls="thread-plan-panel"
                  onClick={() => setPlanOpen(!planOpen)}
                >
                  <span className="plan-summary"><strong>任务计划</strong><span className="plan-count">1 / 5</span><span className="plan-meter" aria-hidden="true"><span></span></span></span>
                  <span className="plan-current"><small>当前</small><span>把任务计划迁移到顶部状态条</span></span>
                  <span className="plan-next"><small>下一步</small><span>更新键盘与响应式交互</span></span>
                  <span className="plan-chevron" aria-hidden="true">⌄</span>
                </button>
                {planOpen ? <PlanPanel panelRef={panelRef} onClose={() => { setPlanOpen(false); requestAnimationFrame(() => triggerRef.current?.focus()); }} /> : null}
              </div>

              <div className="thread-body">
                <div className="transcript">
                  <article className="reading-column answer">
                    <p>全部复核通过。总结本次改动：</p>
                    <h1>已完成：会话工作区不再被右侧上下文挤压</h1>
